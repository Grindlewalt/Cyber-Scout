# nginx for the demo + downloads site (publish_downloads.sh mounts it as conf.d/default.conf).
# Scripts and checksums open as text in the browser (read get.sh before piping it into bash); everything else under
# /downloads/ downloads. /downloads/ itself goes to the install guide instead of a bare 403.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;                       # behind a published port: keep redirects relative
  charset utf-8;
  charset_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /downloads/ { return 302 /download.html; }
  location /downloads/ {
    types {
      text/plain                                sh ps1 txt;
      application/gzip                          gz;
      application/vnd.android.package-archive  apk;
    }
    default_type application/octet-stream;      # the Client builds have no extension
    location = /downloads/SHA256SUMS { default_type text/plain; }
    location = /downloads/VERSION { default_type text/plain; }
  }
  location ~* \.(webp|woff2)$ { expires 30d; }
  location /demo/api/ { expires 1h; }
}
