# CPU-only override (no NVIDIA GPU / container toolkit): drops the GPU reservation. ~4x slower per match.
# Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml in .env (needs Docker Compose >= 2.24).
services:
  worker:
    deploy: !reset {}
    environment:
      FORCE_CPU: "1"
  recorder:
    deploy: !reset {}
    environment:
      FORCE_CPU: "1"
  # processors: only the GPU reservation goes (replicas stay: PROCESSORS_GPU0=N = N CPU-only jobs; ~8-10 cores each)
  processor-gpu0:
    deploy:
      resources: !reset {}
    environment:
      FORCE_CPU: "1"
  processor-gpu1:
    deploy:
      resources: !reset {}
    environment:
      FORCE_CPU: "1"
