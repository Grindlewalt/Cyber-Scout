# Cyber-Scout -- lives in e.g. /opt/cyber-scout (or /opt/stacks/cyber-scout): app/ = this repo, data/ = all state
#   docker compose up -d --build        start / update
#   docker compose logs -f worker       watch matches being processed
# Settings (TBA key, team, events, options) live in the web app, not here; .env holds only infra values.
# No NVIDIA GPU? Use the CPU override: COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml in .env
# (install.sh does this for you).
name: ${CS_PREFIX:-cyber-scout}
services:
  worker:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    container_name: ${CS_PREFIX:-cyber-scout}-worker
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    env_file: .env
    environment:
      DATA: /data
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media     # kept match videos for the interactive player
    # GPU makes a match take ~3-6 min instead of ~20 (removed by docker-compose.cpu.yml).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Live-stream recorder (same image as the worker): records each followed event's livestream (Video page
  # source, or the TBA webcast) during the event's dates, cuts every match out of it with teams/scores read off
  # the broadcast overlay, and the worker picks the clips up without waiting for YouTube uploads / TBA.
  # Recordings + clips go to ${MEDIA_DIR}/live (~2 GB/h, trimmed to LIVE_BUDGET_GB per stream).
  # Status: data/events/<ev>/livestream.json (GET /app/v1/events/<ev>/livestream).  LIVESTREAM=0 turns it off.
  recorder:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    container_name: ${CS_PREFIX:-cyber-scout}-recorder
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    command: ["--recorder"]
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATA: /data
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media
    # overlay OCR (~10x real time on a GPU; CPU works but uses a few cores). Removed by docker-compose.cpu.yml.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: ./app
      dockerfile: server/Dockerfile
    image: ${CS_PREFIX:-cyber-scout}-api:latest
    container_name: ${CS_PREFIX:-cyber-scout}-api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    environment:
      DATA: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    volumes:
      - ./data:/data
    # not published: only reachable through the web container (nginx) at /app/v1/

  web:
    build:
      context: ./app
      dockerfile: web/Dockerfile
    image: ${CS_PREFIX:-cyber-scout}-web:latest
    container_name: ${CS_PREFIX:-cyber-scout}-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    depends_on: [api]
    ports:
      - "${WEB_PORT:-7560}:80"
    volumes:
      - ./data/site/api:/usr/share/nginx/html/api:ro
      - ${MEDIA_DIR:-./data/media}:/usr/share/nginx/html/media:ro
