# Cyber-Scout -- lives in e.g. /opt/cyber-scout (or /opt/stacks/cyber-scout): app/ = this repo, data/ = all state
#   docker compose up -d --build        start / update
#   docker compose logs -f worker       watch matches being processed
# Settings (TBA key, team, events, options) live in the web app, not here; .env holds only infra values.
# No NVIDIA GPU? Use the CPU override: COMPOSE_FILE=docker-compose.yml:docker-compose.cpu.yml in .env
# (install.sh does this for you).
#
# Hardening (security audit): every service drops all Linux capabilities and adds back only what its entrypoint
# needs (root phase: chown of ./data + setpriv to PUID/PGID; nginx: bind :80 + switch to its worker user),
# no-new-privileges, a pids + memory cap, and read-only root filesystems for api + web (tmpfs for scratch).
# Optional .env knobs: GPU_IDS (default "0"; e.g. "1" or "0,1"), GPU_DRIVER (unset = the NVIDIA hook; "cdi" passes
# the card as nvidia.com/gpu=<GPU_IDS>, one card or "all": install.sh sets it where only CDI works), WEB_BIND (default
# 0.0.0.0; e.g. a LAN or Tailscale IP), WORKER_MEM_LIMIT / RECORDER_MEM_LIMIT / API_MEM_LIMIT / WEB_MEM_LIMIT /
# PROCESSOR_MEM_LIMIT.
# Extra tracking jobs (services processor-gpu0/-gpu1): PROCESSORS_GPU0 / PROCESSORS_GPU1 = jobs on host card 0 / 1
# (default 0), PROCESSOR_GPU0_ID / PROCESSOR_GPU1_ID (host card, default 0 / 1), PROCESSOR_GPU_DRIVER (default:
# GPU_DRIVER; "cdi" with ..._ID=nvidia.com/gpu=N), WORKER_TRACK (auto: the worker tracks only while no processor is alive).
name: ${CS_PREFIX:-cyber-scout}
services:
  worker:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    container_name: ${CS_PREFIX:-cyber-scout}-worker
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    # root phase of live/entrypoint.sh: chown -R ./data (CHOWN; DAC_READ_SEARCH to walk 0700 dirs owned by
    # PUID), then setpriv --reuid/--regid/--clear-groups (SETUID, SETGID). The app itself runs as PUID with no
    # capabilities at all (CapEff 0, NoNewPrivs 1).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    pids_limit: 4096                           # threads count: onnxruntime / OpenCV / PyAV pools + ffmpeg / yt-dlp
    mem_limit: ${WORKER_MEM_LIMIT:-12g}
    env_file: .env
    environment:
      DATA: /data
      # small preview copies for client sync (live/proxies.py): MEDIA_PROXIES=0 turns them off; PROXY_GPU = NVENC
      # GPU index as this container sees it (none usable -> libx264 on 2 CPU threads, niced). "video" lets NVENC in.
      MEDIA_PROXIES: ${MEDIA_PROXIES:-1}
      PROXY_GPU: ${PROXY_GPU:-1}
      PROXY_ENCODER: ${PROXY_ENCODER:-auto}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media     # kept match videos for the interactive player
    # GPU makes a match take ~3-6 min instead of ~20 (removed by docker-compose.cpu.yml).
    # GPU_IDS picks the card(s) (nvidia-smi -L numbering); inside the container they are renumbered from 0,
    # so GPU_DEVICE (Settings) stays 0 for a single card. GPU_DRIVER=cdi: the card by CDI name (nvidia.com/gpu=N).
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${GPU_DRIVER:+nvidia.com/gpu=}${GPU_IDS:-0}"]
              capabilities: [gpu]

  # Process-only processors (same image; live/worker.py --process-only): extra match-tracking jobs, one container
  # per job, PROCESSORS_GPU0 / PROCESSORS_GPU1 of them on host card 0 / 1 (.env; default 0 = none). They claim
  # matches in the worker's order (live/claims.py, events/<ev>/priority.json first), each with its own WORKER_ID
  # (<tag>-<container id>-<pid>), and write only the match outputs, the kept clip and their own state files. While
  # one is alive the worker leaves tracking to them (WORKER_TRACK=auto) and keeps TBA, site, discovery, TBA-time
  # cuts, reconcile and preview proxies; it rebuilds the site as soon as a processor's match file appears.
  # Measured on atomosserver (docs/guide/deploy.md "Several jobs per GPU"): ~270-340 MiB VRAM and ~8-10 CPU cores
  # per job.  PAUSE_PROCESSING=1 pauses them too.  `docker compose logs -f processor-gpu1` shows all its jobs.
  processor-gpu0:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]   # entrypoint chown + setpriv only (see worker)
    pids_limit: 2048
    mem_limit: ${PROCESSOR_MEM_LIMIT:-6g}
    command: ["--process-only"]
    stop_grace_period: 30s                     # SIGTERM: the match in hand is given back (not counted as a try)
    env_file: .env
    environment:
      DATA: /data
      PROCESSOR_TAG: gpu0
      GPU_DEVICE: "0"                          # the one card passed in below (container-local index)
      OCR_GPU: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media
    deploy:
      replicas: ${PROCESSORS_GPU0:-0}
      resources:
        reservations:
          devices:
            - driver: ${PROCESSOR_GPU_DRIVER:-${GPU_DRIVER:-nvidia}}
              device_ids: ["${PROCESSOR_GPU0_ID:-${GPU_DRIVER:+nvidia.com/gpu=}0}"]
              capabilities: [gpu]

  processor-gpu1:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    pids_limit: 2048
    mem_limit: ${PROCESSOR_MEM_LIMIT:-6g}
    command: ["--process-only"]
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATA: /data
      PROCESSOR_TAG: gpu1
      GPU_DEVICE: "0"
      OCR_GPU: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media
    deploy:
      replicas: ${PROCESSORS_GPU1:-0}
      resources:
        reservations:
          devices:
            - driver: ${PROCESSOR_GPU_DRIVER:-${GPU_DRIVER:-nvidia}}
              device_ids: ["${PROCESSOR_GPU1_ID:-${GPU_DRIVER:+nvidia.com/gpu=}1}"]
              capabilities: [gpu]

  # Live-stream recorder (same image as the worker): records each followed event's livestream (Video page
  # source, or the TBA webcast) during the event's dates, cuts every match out of it with teams/scores read off
  # the broadcast overlay, and the worker picks the clips up without waiting for YouTube uploads / TBA.
  # Recordings + clips go to ${MEDIA_DIR}/live (~2 GB/h, trimmed to LIVE_BUDGET_GB per stream).
  # Status: data/events/<ev>/livestream.json (GET /app/v1/events/<ev>/livestream).  LIVESTREAM=0 turns it off.
  recorder:
    build: ./app
    image: ${CS_PREFIX:-cyber-scout}-worker:latest
    container_name: ${CS_PREFIX:-cyber-scout}-recorder
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]   # entrypoint chown + setpriv only (see worker)
    pids_limit: 4096
    mem_limit: ${RECORDER_MEM_LIMIT:-8g}
    command: ["--recorder"]
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATA: /data
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media
    # overlay OCR (~10x real time on a GPU; CPU works but uses a few cores). Removed by docker-compose.cpu.yml.
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              device_ids: ["${GPU_DRIVER:+nvidia.com/gpu=}${GPU_IDS:-0}"]
              capabilities: [gpu]

  api:
    build:
      context: ./app
      dockerfile: server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}                  # version shown by /app/v1/info (else VERSION file / code hash)
    image: ${CS_PREFIX:-cyber-scout}-api:latest
    container_name: ${CS_PREFIX:-cyber-scout}-api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    cap_drop: [ALL]
    # server/entrypoint.sh root phase: mkdir data/config inside the PUID-owned ./data (DAC_OVERRIDE), chown -h a
    # few files (CHOWN), setpriv to PUID/PGID (SETUID, SETGID); uvicorn then runs with no capabilities.
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    pids_limit: 256
    mem_limit: ${API_MEM_LIMIT:-1g}
    read_only: true                            # only ./data (volume) and /tmp (tmpfs) are writable
    tmpfs:
      - /tmp:size=64m,mode=1777
    # No env_file here on purpose: the api gets an explicit allowlist of .env values (defaults = server/config.py),
    # so secrets or worker-only settings in .env (e.g. a legacy TBA_KEY) never reach it. Add new api knobs here.
    environment:
      DATA: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      PASSWORD_MIN: ${PASSWORD_MIN:-10}
      MEMBER_PASSWORD_MIN: ${MEMBER_PASSWORD_MIN:-4}
      SETUP_CODE_REQUIRED: ${SETUP_CODE_REQUIRED:-1}
      PYTHONDONTWRITEBYTECODE: "1"
      # client sync (docs/SYNC.md): media list reads MEDIA (read-only mount below); bundle cache in data/cache/sync
      MEDIA: /media
      SERVER_NAME: ${SERVER_NAME:-}
      SYNC_CACHE_MB: ${SYNC_CACHE_MB:-256}
      # pasted Video-page links are checked here (live/sources.py): private hosts an admin allows; one HEAD probe
      CS_URL_ALLOW: ${CS_URL_ALLOW:-}
      CS_PROBE_LINKS: ${CS_PROBE_LINKS:-1}
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./data/media}:/media:ro  # only listed (/app/v1/sync/media); nginx serves the files
    # not published: only reachable through the web container (nginx) at /app/v1/

  web:
    build:
      context: ./app
      dockerfile: web/Dockerfile
    image: ${CS_PREFIX:-cyber-scout}-web:latest
    container_name: ${CS_PREFIX:-cyber-scout}-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # no setuid escalation inside the container
    # nginx master: bind :80 (NET_BIND_SERVICE), chown its temp dirs (CHOWN), drop workers to `nginx` (SETUID/SETGID)
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETUID, SETGID]
    pids_limit: 256
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    read_only: true                            # nginx writes only its pid + temp files (tmpfs below)
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /tmp:size=16m,mode=1777
    depends_on: [api]
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-7560}:80"   # WEB_BIND: publish on one address only (LAN / Tailscale IP)
    volumes:
      - ./data/site/api:/usr/share/nginx/html/api:ro
      - ${MEDIA_DIR:-./data/media}:/usr/share/nginx/html/media:ro
