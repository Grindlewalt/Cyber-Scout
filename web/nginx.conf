server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css;
    location /api/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /media/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
