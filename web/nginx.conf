# Cyber-Scout web: static app (public: it is only the login / setup shell, no data), the API under /app/v1/,
# and the site JSON (/api/) + match videos (/media/) gated by a session check against the API (auth_request).
# Plain HTTP on the LAN / Tailscale; through the Cloudflare tunnel (https://scout...) cookies become Secure.

# --- real client address -----------------------------------------------------------------------------------
# Only a trusted peer may say who the client is: the docker bridge gateway (host-side cloudflared and anything else
# reaching the published port from the host itself) and loopback. LAN / Tailscale browsers connect directly with
# their own address (10.x / 100.x) and any X-Forwarded-For they send is ignored here. Cloudflare appends the real
# client address to X-Forwarded-For, so with real_ip_recursive the right-most untrusted hop is the client.
# The API additionally treats ANY Cf-*/X-Forwarded-For public hop as "not the team network" (fails closed even if
# this list is wrong), so this mainly feeds the per-IP login rate limits and the audit log.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $from_proxy {
    default        0;
    172.16.0.0/12  1;
    127.0.0.1      1;
}
# scheme the browser used: trust X-Forwarded-Proto only from the proxy (cloudflared sends https)
map "$from_proxy:$http_x_forwarded_proto" $fwd_proto {
    default    $scheme;
    "1:https"  https;
    "1:http"   http;
}
map $fwd_proto $hsts {
    https    "max-age=15552000";
    default  "";
}

# --- caching (perf): versioned shell files (web/Dockerfile rewrites index.html to name.js?v=<hash>) never change
# under their URL, so browsers and the Cloudflare edge keep them for a year; unversioned files revalidate (ETag).
map $arg_v $shell_cc {
    ""       "no-cache";
    default  "public, max-age=31536000, immutable";
}
# auth_request answers are cached for a few seconds per session cookie + client address (cache below), so the ~10-30
# JSON files a page pulls cost one API round trip instead of one each. Never cached without a session cookie.
map $cookie_cs_session $auth_nocache {
    ""       1;
    default  0;
}
proxy_cache_path /var/cache/nginx/cs_auth levels=1 keys_zone=cs_auth:1m max_size=8m inactive=30s use_temp_path=off;

# nginx-level brake on password guessing (the API also limits per IP+username): 10/min per real client IP
limit_req_zone $binary_remote_addr zone=cs_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # compression: precompressed .gz next to the shell files (web/Dockerfile) via gzip_static, on-the-fly for site
    # JSON / API answers. Level 5 is ~20% smaller than the default 1 for a few ms on the largest match file.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;
    # Docker's DNS, resolved per request: nginx still starts (and serves the shell) if the api is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # --- security headers (repeated per location: add_header in a location replaces the server-level ones)
    # The app has no inline scripts; styles use inline style attributes; fonts/favicon are data: URIs. YouTube
    # (embeds + thumbnails) and Google Fonts are allowed in case pages add them.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com https://img.youtube.com; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    set $csp_data "default-src 'none'; media-src 'self'; frame-ancestors 'self'";
    set $perms "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=()";

    # --- never serve dotfiles or database / backup files, whatever ends up in the web root or a data dir
    location ~ /\. { return 404; }
    location ~* \.(db|db-wal|db-shm|db-journal|sqlite|sqlite3|bak|swp|env|pem|key)$ { return 404; }

    # --- session check used by auth_request (any signed-in role, viewer+)
    location = /_auth {
        internal;
        proxy_pass $api/app/v1/auth/check;
        # brief cache of the yes answer (204 only; 401 / errors always go to the API). A sign-out or revoked
        # session therefore stops opening /api + /media within 5 s. Key = session cookie + everything the API's
        # network checks look at (passwordless "lan" sessions must not carry over to tunnel traffic).
        proxy_cache cs_auth;
        proxy_cache_key "$cookie_cs_session|$remote_addr|$http_x_forwarded_for|$http_cf_connecting_ip|$http_x_forwarded_proto";
        proxy_cache_valid 204 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_ignore_headers Cache-Control Expires;
        proxy_no_cache $auth_nocache;
        proxy_cache_bypass $auth_nocache;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location @unauthorized {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_data always;
        return 401 '{"detail":"sign in required"}';
    }
    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_data always;
        return 503 '{"detail":"the Cyber-Scout API is not running"}';
    }

    # --- sign-in: same proxy settings as /app/v1/ plus the per-IP request limit
    location = /app/v1/auth/login {
        limit_req zone=cs_login burst=10 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 16k;
        error_page 502 504 = @api_down;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts always;
    }

    # --- client sync (docs/SYNC.md). /app/v1/info is public on the API side (no auth_request anywhere under
    # /app/v1/: the API checks sessions itself); the API sends Cache-Control "public, max-age=10" for it.
    # Bundles: gzip tars up to 64 MB (uncompressed) streamed straight through (no buffering to the read-only
    # container's 64 MB tmpfs), Range / If-Range passed on for resume, long timeouts for slow venue Wi-Fi.
    location = /app/v1/sync/bundle {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        client_max_body_size 4m;
        gzip off;
        error_page 502 504 = @api_down;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
    }

    # --- platform API (FastAPI). No /app/v1/docs; /app/v1/openapi.json is admin-only (API side)
    location ^~ /app/v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
        error_page 502 504 = @api_down;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
    }

    # --- generated site JSON + kept match videos: signed-in users only
    location /api/ {
        auth_request /_auth;
        error_page 401 = @unauthorized;
        error_page 500 502 504 = @api_down;
        # private: never stored by the Cloudflare edge; no-cache: revalidated (304 via ETag) on every use
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp_data always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }
    # kept match videos, incl. the small sync proxies (media/<ev>/proxy/<match>.mp4) and livestream clips
    location /media/ {
        auth_request /_auth;
        error_page 401 = @unauthorized;
        error_page 500 502 504 = @api_down;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp_data always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }

    # --- the app shell (login / setup screens and the page code; holds no data)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri /index.html;
    }
    # PWA manifest ("Add to Home Screen" on phones)
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # service worker: always revalidated (never immutable), or browsers would keep an old offline cache forever
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }
    # page code + styles: immutable when requested as name.js?v=<hash> (index.html), revalidated otherwise
    location ~* ^/[A-Za-z0-9_.-]+\.(?:js|css)$ {
        add_header Cache-Control $shell_cc always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }
    # self-hosted fonts (themes.css): content never changes under a name (a new cut gets a new file name)
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy $perms always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }
}
