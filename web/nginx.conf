# Cyber-Scout web: static app (public: it is only the login / setup shell, no data), the API under /app/v1/,
# and the site JSON (/api/) + match videos (/media/) gated by a session check against the API (auth_request).
# Plain HTTP on the LAN / Tailscale; behind a TLS proxy pass X-Forwarded-Proto: https and cookies become Secure.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css;
    # Docker's DNS, resolved per request: nginx still starts (and serves the shell) if the api is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # --- session check used by auth_request (any signed-in role, viewer+)
    location = /_auth {
        internal;
        proxy_pass $api/app/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location @unauthorized {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"detail":"sign in required"}';
    }
    location @api_down {
        default_type application/json;
        return 503 '{"detail":"the Cyber-Scout API is not running"}';
    }

    # --- platform API (FastAPI)
    location /app/v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
        error_page 502 504 = @api_down;
    }

    # --- generated site JSON + kept match videos: signed-in users only
    location /api/ {
        auth_request /_auth;
        error_page 401 = @unauthorized;
        error_page 500 502 504 = @api_down;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /media/ {
        auth_request /_auth;
        error_page 401 = @unauthorized;
        error_page 500 502 504 = @api_down;
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- the app shell (login / setup screens and the page code; holds no data)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
